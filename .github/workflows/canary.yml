# Daily dependency canary.
#
# Dependencies float with `>=` floors, so a fresh resolve always picks the
# newest allowed versions — including camoufox's browser binary, which moves
# independently of its PyPI package via GitHub releases. This workflow
# resolves everything fresh, fetches the latest browser, runs the test suite
# plus one real stealth fetch, and opens a deduplicated issue on failure
# (closing it again on the first green run).
name: dependency-canary

on:
  schedule:
    - cron: "17 21 * * *" # daily; off-the-hour minute avoids runner peak
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve newest allowed dependency versions
        run: uv lock --upgrade

      - name: Install environment (including test extra)
        run: uv sync --all-extras

      - name: Record resolved versions
        run: |
          mkdir -p .temp
          uv pip list 2>/dev/null \
            | grep -Ei '^(camoufox|playwright|scrapling|curl-cffi|mcp) ' \
            | tee .temp/canary-versions.txt || true

      - name: Install Firefox runtime system libraries
        run: uv run --no-sync python -m playwright install-deps firefox

      - name: Look up latest camoufox release
        id: camoufox-release
        run: >
          echo "tag=$(curl -fsSL https://api.github.com/repos/daijro/camoufox/releases/latest
          | jq -r .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Restore camoufox browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ steps.camoufox-release.outputs.tag }}

      - name: Fetch camoufox browser if needed
        # camoufox fetch is idempotent: it compares the installed version
        # against the latest release and only downloads on a mismatch.
        run: uv run --no-sync python -m camoufox fetch

      - name: Run test suite
        run: uv run --no-sync pytest -q

      - name: Real stealth smoke fetch
        run: uv run --no-sync python scripts/canary_smoke.py

      - name: Open or update canary issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create deps-canary --color D93F0B --force
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          versions="$(cat .temp/canary-versions.txt 2>/dev/null || echo unknown)"
          body=$(printf 'The daily dependency canary failed.\n\nRun: %s\n\nResolved versions:\n\n```\n%s\n```\n' \
            "$run_url" "$versions")
          number=$(gh issue list --label deps-canary --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh issue create --label deps-canary \
              --title "Dependency canary failed ($(date -u +%F))" \
              --body "$body"
          else
            gh issue comment "$number" --body "$body"
          fi

      - name: Close canary issue after a green run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions="$(paste -sd' ' .temp/canary-versions.txt 2>/dev/null || echo unknown)"
          for number in $(gh issue list --label deps-canary --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment \
              "Canary passed on $(date -u +%F) with: $versions"
          done
