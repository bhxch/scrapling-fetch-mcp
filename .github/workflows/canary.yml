# Daily dependency canary.
#
# Dependencies float with `>=` floors, so a fresh resolve always picks the
# newest allowed versions — including camoufox's browser binary, which moves
# independently of its PyPI package via GitHub releases. This workflow
# resolves everything fresh, fetches the latest browser, and runs the test
# suite plus one real stealth fetch.
name: dependency-canary

on:
  schedule:
    - cron: "17 21 * * *" # daily; off-the-hour minute avoids runner peak
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve newest allowed dependency versions
        run: uv lock --upgrade

      - name: Install environment (including test extra)
        run: uv sync --all-extras

      - name: Record resolved versions
        run: |
          mkdir -p .temp
          uv pip list 2>/dev/null \
            | grep -Ei '^(camoufox|playwright|scrapling|curl-cffi|mcp) ' \
            | tee .temp/canary-versions.txt || true

      - name: Install Firefox runtime system libraries
        run: uv run --no-sync python -m playwright install-deps firefox

      - name: Look up latest camoufox release
        id: camoufox-release
        # Unauthenticated GitHub API, subject to shared runner IP rate
        # limits — let curl retry before failing the whole run.
        run: >
          echo "tag=$(curl --retry 5 --retry-delay 30 --retry-all-errors -fsSL
          https://api.github.com/repos/daijro/camoufox/releases/latest
          | jq -r .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Restore camoufox browser cache
        id: camoufox-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ steps.camoufox-release.outputs.tag }}

      - name: Fetch camoufox browser if needed
        # camoufox fetch re-queries the unauthenticated GitHub releases API
        # on every run even when the browser is current, and 403s when the
        # shared runner IP is rate limited. An exact cache hit already
        # guarantees the browser matches the latest tag, so skip the call
        # entirely; otherwise retry with exponential backoff.
        if: steps.camoufox-cache.outputs.cache-hit != 'true'
        run: |
          for backoff in 0 30 60 120; do
            if [ "$backoff" -gt 0 ]; then
              echo "Retrying in ${backoff}s..."
              sleep "$backoff"
            fi
            if uv run --no-sync python -m camoufox fetch; then
              exit 0
            fi
            echo "camoufox fetch failed"
          done
          exit 1

      - name: Run test suite
        run: uv run --no-sync pytest -q

      - name: Real stealth smoke fetch
        run: uv run --no-sync python scripts/canary_smoke.py
