[project]
name = "scrapling-fetch-mcp"
version = "0.2.0"
description = "Helps AI assistants access text content from bot-protected websites. MCP server that fetches HTML/markdown from sites with anti-automation measures using Scrapling."
readme = "README.md"
authors = [
    { name = "restlessronin", email = "88921269+restlessronin@users.noreply.github.com" },
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "beautifulsoup4>=4.14.2",
    "browserforge>=1.2.3",
    # Capped below 0.5 on purpose: camoufox 0.5.x drops the launch kwargs
    # scrapling 0.3.x passes through (stealth fetch dies with
    # "launch_persistent_context() got an unexpected keyword argument
    # 'allow_webgl'") and moves to a new, incompatible ~/.cache/camoufox
    # layout that breaks 0.4.x installs sharing the same cache. Revisit
    # together with a scrapling upgrade that supports the 0.5 API.
    "camoufox>=0.4.11,<0.5",
    "curl-cffi>=0.13.0",
    "lxml>=6.0.2",
    "markdownify>=1.2.0",
    "markitdown>=0.1.0",  # NEW - HTML to Markdown converter (0.1.0+ for stable API)
    "mcp>=2.0.0, <3.0.0",
    "msgspec>=0.19.0",
    "packaging>=24.1, <25.0",
    # Kept as a direct dependency on purpose: camoufox launches its Firefox
    # through playwright (upstream declares it unpinned), so the driver
    # version is controlled here. Its chromium download is never used.
    "playwright>=1.55.0",
    "pyyaml>=6.0",
    "readability-lxml>=0.8.1",
    # Capped below 0.4 on purpose: scrapling 0.4.x imports patchright
    # unconditionally at module level while declaring it only in the
    # optional [fetchers] extra, and drops the camoufox engine our stealth
    # modes run on. We cover the fetcher dependencies ourselves and do not
    # declare patchright, so a 0.4.x resolve breaks every fetch mode.
    # Revisit only as a deliberate 0.4.x migration (add patchright, drop
    # camoufox machinery).
    "scrapling>=0.3.6,<0.4",
    "trafilatura>=1.6.0",
]

[project.urls]
"Homepage" = "https://github.com/cyberchitta/scrapling-fetch-mcp"
"Bug Tracker" = "https://github.com/cyberchitta/scrapling-fetch-mcp/issues"

[project.scripts]
scrapling-fetch-mcp = "scrapling_fetch_mcp.mcp:run_server"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/**"]

[tool.hatch.build.targets.wheel]
sources = ["src"]
